# Podman inside the hybrid image's container (DinD mode).
#
# What upstream's image got from its `quay.io/podman/stable` base, which is
# built to run podman nested: build containers share the outer container's
# namespaces rather than nesting new ones, and nothing assumes a systemd
# manager. The outer container being privileged is what makes this work, as it
# always was.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

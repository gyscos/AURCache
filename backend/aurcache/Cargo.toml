[package]
name = "aurcache"
version = "0.5.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
tokio = {workspace = true}
anyhow ={workspace = true}
sea-orm = {workspace = true}
tracing = {workspace = true}

pacman-repo-utils = {path = "../pacman-repo-utils"}
pacman-mirrors = {path = "../pacman-mirrors"}
aurcache-builder = {path = "../aurcache-builder"}
aurcache-db = {path = "../aurcache-db"}
aurcache-api = { path = "../aurcache-api" }
aurcache-ca = { path = "../aurcache-ca" }
aurcache-scheduler = {path = "../aurcache-scheduler"}
aurcache-types = {path = "../aurcache-types"}
aurcache-utils = {path = "../aurcache-utils"}

dotenvy = "0.15.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.aarch64-unknown-linux-gnu.dependencies]
openssl = { version = "*", features = ["vendored"] }

[[bin]]
name = "aurcache"
path = "src/main.rs"

[features]
static = ["aurcache-api/static"]
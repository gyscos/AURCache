[package]
name = "aurcache-worker-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
rcgen = { version = "0.14", features = ["pem"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
flate2 = { workspace = true }
tar = { workspace = true }
percent-encoding = "2.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
aurcache-common = { path = "../aurcache-common" }

[dev-dependencies]
tempfile = { workspace = true }
# For the cross-check that the worker's own fingerprint matches the one the
# server derives from the CSR, through an entirely different parser.
aurcache-ca = { path = "../aurcache-ca" }

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'

jobs:
  lintAndTestRust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: |
          rustup update
          rustup component add clippy
          rustup install stable          

      # `aurcache-api`'s `static` feature compiles the frontend to wasm inside
      # its build script, which needs the wasm target and the wasm-bindgen CLI
      # pinned to the frontend's lockfile. The Docker images install both
      # through this script; CI uses the same one so the two cannot drift.
      - name: Install wasm toolchain
        run: bash ../docker/install-wasm-bindgen.sh ../frontend-rs/Cargo.lock

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      # The server parses a PKGBUILD by running this script through
      # aurcache-sandbox, both by absolute path (`aurcache-utils/src/pkgbuild.rs`).
      # Tests that parse one skip without them locally, and fail under CI, so
      # both paths are exported here. The runtime image installs the script the
      # same way - see docker/server.Dockerfile.
      - name: Install alpm-pkgbuild-bridge
        run: |
          curl -sSLf -o "$RUNNER_TEMP/alpm-pkgbuild-bridge" \
            "https://gitlab.archlinux.org/archlinux/alpm/alpm-pkgbuild-bridge/-/raw/main/alpm-pkgbuild-bridge.sh?ref_type=heads"
          sudo install -m 755 "$RUNNER_TEMP/alpm-pkgbuild-bridge" /usr/local/bin/alpm-pkgbuild-bridge
          echo "AURCACHE_PKGBUILD_BRIDGE=/usr/local/bin/alpm-pkgbuild-bridge" >> "$GITHUB_ENV"
          echo "AURCACHE_SANDBOX=$PWD/target/debug/aurcache-sandbox" >> "$GITHUB_ENV"

      # `aurcache-api`'s `static` feature embeds the built web UI via
      # `#[derive(RustEmbed)] #[folder = "web"]`, which fails to compile unless
      # that directory exists. Only the Docker build populates it, so without a
      # placeholder the whole `embed` module is invisible to clippy. An empty
      # directory is enough for the derive.
      - name: Create placeholder web assets
        run: |
          mkdir -p aurcache-api/web
          # Not just an empty directory: the app-shell fallback tests ask the
          # handler for index.html, and RustEmbed bakes in whatever is here at
          # compile time.
          echo '<!doctype html><title>AURCache</title>' > aurcache-api/web/index.html

      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features static -p aurcache-api -- -D warnings

      - name: Test
        run: |
          cargo check
          # `cargo test` builds no plain binaries for a crate without
          # integration tests, and the PKGBUILD tests need this one.
          cargo build -p aurcache-sandbox
          cargo test --all
          # The app-shell fallback only exists under `static`, which is also
          # what mounts the asset handler, so its tests are invisible to the
          # run above.
          cargo test -p aurcache-api --features static

      # The Dockerfiles build a subset of the workspace, not all of it. Cargo
      # unifies features across whatever is selected, and `cargo test --all`
      # also pulls in dev-dependencies -- so a crate can under-declare a
      # feature, compile fine here, and still fail in the image. Checking the
      # exact package sets the Dockerfiles use is what catches that.
      - name: Check Docker build shapes
        run: |
          # docker/worker.Dockerfile
          cargo check -p aurcache-worker -p aurcache-sandbox
          # docker/hybrid.Dockerfile
          cargo check -p aurcache -p aurcache-worker -p aurcache-worker-docker -p aurcache-sandbox
          # docker/build-rust.sh
          cargo check --features static

      # `aurcache-common` exists so a browser frontend can share the API shapes
      # without a database driver or the filesystem helpers. Every workspace
      # build turns the `db` and `fs` features on, so only an explicit
      # no-default-features check proves that still holds.
      - name: Check driver-free types
        run: |
          cargo check -p aurcache-common --no-default-features
          cargo check -p aurcache-client
  e2eTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The e2e suite builds the images, which read the PKGBUILDs from the
          # AUR submodules under packaging/.
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run E2E test
        run: ./scripts/test-e2e.sh hello

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'master'

jobs:
  lintAndTestRust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: |
          rustup update
          rustup component add clippy
          rustup install stable          

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      # `alpm-srcinfo` shells out to this script to parse a PKGBUILD; it is not
      # bundled in the crate, which resolves it from $PATH at runtime. Without
      # it, every test that parses a *patched* PKGBUILD fails (unpatched sources
      # read the shipped .SRCINFO instead and pass either way). The runtime
      # image installs it the same way - see docker/Dockerfile.
      - name: Install alpm-pkgbuild-bridge
        run: |
          curl -sSLf -o "$RUNNER_TEMP/alpm-pkgbuild-bridge" \
            "https://gitlab.archlinux.org/archlinux/alpm/alpm-pkgbuild-bridge/-/raw/main/alpm-pkgbuild-bridge.sh?ref_type=heads"
          sudo install -m 755 "$RUNNER_TEMP/alpm-pkgbuild-bridge" /usr/local/bin/alpm-pkgbuild-bridge
          command -v alpm-pkgbuild-bridge

      # `aurcache-api`'s `static` feature embeds the built web UI via
      # `#[derive(RustEmbed)] #[folder = "web"]`, which fails to compile unless
      # that directory exists. Only the Docker build populates it, so without a
      # placeholder the whole `embed` module is invisible to clippy. An empty
      # directory is enough for the derive.
      - name: Create placeholder web assets
        run: mkdir -p aurcache-api/web

      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features static -p aurcache-api -- -D warnings

      - name: Test
        run: |
          cargo check
          cargo test --all

      # The Dockerfiles build a subset of the workspace, not all of it. Cargo
      # unifies features across whatever is selected, and `cargo test --all`
      # also pulls in dev-dependencies -- so a crate can under-declare a
      # feature, compile fine here, and still fail in the image. Checking the
      # exact package sets the Dockerfiles use is what catches that.
      - name: Check Docker build shapes
        run: |
          # docker/worker.Dockerfile
          cargo check -p aurcache-worker -p aurcache-sandbox
          # docker/hybrid.Dockerfile
          cargo check -p aurcache -p aurcache-worker -p aurcache-worker-docker -p aurcache-sandbox
          # docker/build-rust.sh
          cargo check --features static

      # `aurcache-types` exists so a browser frontend can share the API shapes
      # without a database driver. Every workspace build turns the `db` feature
      # on, so only an explicit no-default-features check proves that still holds.
      - name: Check driver-free types
        run: |
          cargo check -p aurcache-types --no-default-features
          cargo check -p aurcache-client
  lintFlutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Toolchain info
        run: flutter doctor

      - name: Build Runner
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
      - name: Lint
        run: flutter analyze --no-fatal-infos

      - name: formatting
        run: dart format --set-exit-if-changed .
  e2eTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run E2E test
        run: ./scripts/test-e2e.sh hello

name: E2E (nightly)

# The full end-to-end suite builds the server and worker images and exercises
# them against the real AUR and Arch mirrors. That makes it slow (~15 min) and
# flaky in ways no diff can fix, so it runs once a night instead of on every
# push -- and only when something actually landed since the last slot.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  e2eTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The e2e suite builds the images, which read the PKGBUILDs from the
          # AUR submodules under packaging/.
          submodules: recursive

      - name: Check for new commits
        id: changed
        run: |
          # Scheduled runs fire even when nothing landed. A manual run always
          # goes ahead; a scheduled one only when HEAD is newer than the last
          # slot (24h plus slack for queue delays).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git log -1 --format=%ct)" -ge "$(($(date +%s) - 90000))" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 25h; skipping."
          fi

      - name: Set up Docker
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Run E2E test
        if: steps.changed.outputs.run == 'true'
        run: ./scripts/test-e2e.sh hello

name: Build and Push Docker Images

# Publishes the backend-only image as `aurcache-server`. The `aurcache`
# name is reserved for the hybrid (server + embedded worker) compatibility
# image, so existing single-container compose files keep working when they
# pull `aurcache:latest`. New setups use `aurcache-server` + `aurcache-worker`.

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request_target:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch:
          - amd64
          - arm64/v8
        include:
          - arch: amd64
            tag_suffix: ""
          - arch: arm64/v8
            tag_suffix: "-aarch64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: repo_name_lc
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tag=git" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Build and push aurcache-server (${{ matrix.tag_suffix }})
        if: steps.vars.outputs.tag != 'unknown'
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --build-arg LATEST_COMMIT_SHA=${{ github.event.head_commit.id }} \
            --build-arg TARGET_ARCH=linux/${{ matrix.arch }} \
            -f ./docker/Dockerfile \
            -t ghcr.io/${{ steps.repo_name_lc.outputs.lowercase }}-server:${{ steps.vars.outputs.tag }}${{ matrix.tag_suffix }} \
            --push .

      - name: Also tag and push aurcache-server:latest${{ matrix.tag_suffix }} (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create \
            ghcr.io/${{ steps.repo_name_lc.outputs.lowercase }}-server:${{ steps.vars.outputs.tag }}${{ matrix.tag_suffix }} \
            --tag ghcr.io/${{ steps.repo_name_lc.outputs.lowercase }}-server:latest${{ matrix.tag_suffix }}
